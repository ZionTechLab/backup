name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Restore env file
        run: cp /home/ghrunner/config/express-be.env .env

      - name: Install dependencies
        run: npm install

      - name: Run petycash migrations
        run: npm run migrate:petycash

      - name: Restart app
        run: |
          pm2 restart app --update-env || pm2 start npm --name "app" -- start