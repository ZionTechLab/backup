<svg viewBox="0 0 620 190" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="620" height="190" fill="#f4f6f9"/>
  <text x="20" y="30" fill="#212529" font-size="16" font-weight="700">Theme Settings</text>

  <!-- Mode -->
  <rect x="20" y="46" width="136" height="120" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="32" y="66" fill="#212529" font-size="11" font-weight="700">Mode</text>
  <text x="32" y="82" fill="#6c757d" font-size="8">Toggle light / dark appearance.</text>
  <rect x="32" y="96" width="34" height="18" rx="9" fill="#212529"/>
  <circle cx="57" cy="105" r="7" fill="#fff"/>
  <text x="72" y="109" fill="#212529" font-size="9">Dark mode</text>

  <!-- UI Style -->
  <rect x="164" y="46" width="136" height="120" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="176" y="66" fill="#212529" font-size="11" font-weight="700">UI Style</text>
  <text x="176" y="82" fill="#6c757d" font-size="8">Visual style for components.</text>
  <rect x="176" y="96" width="112" height="20" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="184" y="110" fill="#212529" font-size="9">Galaxy</text>
  <path d="M272 102 l6 6 l6 -6" stroke="#6c757d" stroke-width="1.4" fill="none"/>

  <!-- Color Palette -->
  <rect x="308" y="46" width="136" height="120" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="320" y="66" fill="#212529" font-size="11" font-weight="700">Color Palette</text>
  <text x="320" y="82" fill="#6c757d" font-size="8">Pick a color scheme.</text>
  <rect x="320" y="96" width="112" height="20" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="328" y="110" fill="#212529" font-size="9">Ocean Blue</text>
  <path d="M416 102 l6 6 l6 -6" stroke="#6c757d" stroke-width="1.4" fill="none"/>
  <circle cx="326" cy="140" r="6" fill="#0d6efd"/>
  <circle cx="342" cy="140" r="6" fill="#6f42c1"/>
  <circle cx="358" cy="140" r="6" fill="#20c997"/>
  <circle cx="374" cy="140" r="6" fill="#fd7e14"/>

  <!-- Menu Contrast -->
  <rect x="452" y="46" width="148" height="120" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="464" y="66" fill="#212529" font-size="11" font-weight="700">Menu Contrast</text>
  <text x="464" y="82" fill="#6c757d" font-size="8">Menu vs. workspace contrast.</text>
  <rect x="464" y="96" width="124" height="20" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="472" y="110" fill="#212529" font-size="9">Distinct</text>
  <path d="M572 102 l6 6 l6 -6" stroke="#6c757d" stroke-width="1.4" fill="none"/>
</svg>
