<svg viewBox="0 0 560 70" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="560" height="70" rx="10" fill="#161c27"/>
  <rect x="1" y="1" width="558" height="68" rx="9" fill="none" stroke="#2c374a"/>

  <!-- Search pill -->
  <rect x="16" y="18" width="230" height="34" rx="8" fill="#1f2734" stroke="#2c374a"/>
  <circle cx="34" cy="35" r="5" fill="none" stroke="#8a93a6" stroke-width="1.6"/>
  <line x1="38" y1="39" x2="42" y2="43" stroke="#8a93a6" stroke-width="1.6" stroke-linecap="round"/>
  <text x="50" y="39" fill="#8a93a6" font-size="12">Search or jump to...</text>
  <rect x="206" y="26" width="30" height="18" rx="4" fill="#2c374a"/>
  <text x="221" y="38" fill="#aab3c5" font-size="9" text-anchor="middle">⌘K</text>

  <!-- Notifications -->
  <g>
    <circle cx="290" cy="35" r="18" fill="none"/>
    <path d="M290 24 a8 8 0 0 0 -8 8 v5 l-3 4 h22 l-3 -4 v-5 a8 8 0 0 0 -8 -8 z" fill="none" stroke="#c3cad8" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M286 44 a4 4 0 0 0 8 0" fill="none" stroke="#c3cad8" stroke-width="1.6"/>
    <circle cx="300" cy="24" r="7" fill="#e5484d"/>
    <text x="300" y="27" fill="#fff" font-size="9" text-anchor="middle" font-weight="700">4</text>
  </g>

  <!-- Theme toggle (moon) -->
  <g>
    <circle cx="340" cy="35" r="18" fill="none"/>
    <path d="M347 27 a10 10 0 1 0 0 16 a8 8 0 0 1 0 -16 z" fill="none" stroke="#c3cad8" stroke-width="1.6" stroke-linejoin="round"/>
  </g>

  <!-- Fullscreen -->
  <g stroke="#c3cad8" stroke-width="1.6" fill="none">
    <circle cx="386" cy="35" r="18" fill="none" stroke="none"/>
    <path d="M378 29 v-4 h4 M394 29 v-4 h-4 M378 41 v4 h4 M394 41 v4 h-4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- User pill -->
  <rect x="424" y="16" width="120" height="38" rx="19" fill="#1f2734" stroke="#2c374a"/>
  <circle cx="446" cy="35" r="14" fill="#e07b39"/>
  <text x="446" y="39" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">AU</text>
  <text x="468" y="39" fill="#e8ebf1" font-size="12" font-weight="600">Admin</text>
  <path d="M522 31 l6 6 l6 -6" stroke="#8a93a6" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Callout numbers -->
  <g font-size="11" fill="#4f7cff" font-weight="700">
    <text x="16" y="66">①</text>
    <text x="278" y="66">②</text>
    <text x="328" y="66">③</text>
    <text x="374" y="66">④</text>
    <text x="424" y="66">⑤</text>
  </g>
</svg>
