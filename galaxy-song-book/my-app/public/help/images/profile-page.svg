<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="620" height="260" fill="#f4f6f9"/>
  <text x="20" y="30" fill="#212529" font-size="16" font-weight="700">Profile</text>

  <!-- Account details card -->
  <rect x="20" y="46" width="260" height="150" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="34" y="68" fill="#212529" font-size="12" font-weight="700">Account Details</text>
  <g fill="#6c757d" font-size="10">
    <text x="34" y="90">Full Name</text>
    <text x="34" y="108">Username</text>
    <text x="34" y="126">Email</text>
    <text x="34" y="144">Role</text>
    <text x="34" y="162">Department</text>
  </g>
  <g fill="#212529" font-size="10">
    <text x="150" y="90">Admin User</text>
    <text x="150" y="108">admin</text>
    <text x="150" y="126">admin@example.com</text>
    <text x="150" y="144">Admin</text>
    <text x="150" y="162">—</text>
  </g>

  <!-- Change password card -->
  <rect x="296" y="46" width="304" height="150" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="310" y="68" fill="#212529" font-size="12" font-weight="700">Change Password</text>
  <text x="310" y="86" fill="#6c757d" font-size="9">CURRENT PASSWORD</text>
  <rect x="310" y="90" width="276" height="20" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="310" y="122" fill="#6c757d" font-size="9">NEW PASSWORD</text>
  <rect x="310" y="126" width="276" height="20" rx="4" fill="#fff" stroke="#ced4da"/>
  <rect x="310" y="160" width="130" height="26" rx="4" fill="#0d6efd"/>
  <text x="375" y="177" fill="#fff" font-size="10" text-anchor="middle" font-weight="600">Change Password</text>

  <!-- 2FA card -->
  <rect x="20" y="204" width="580" height="44" rx="6" fill="#fff" stroke="#dee2e6"/>
  <text x="34" y="222" fill="#212529" font-size="11" font-weight="700">Two-Factor Authentication</text>
  <text x="34" y="238" fill="#6c757d" font-size="9">Authenticator App — Not enabled</text>
  <rect x="530" y="216" width="56" height="18" rx="9" fill="#e9ecef"/>
  <text x="558" y="229" fill="#6c757d" font-size="8" text-anchor="middle" font-weight="700">INACTIVE</text>
</svg>
