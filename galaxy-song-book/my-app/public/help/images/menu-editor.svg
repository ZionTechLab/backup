<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="620" height="300" rx="8" fill="#161c27"/>
  <rect x="1" y="1" width="618" height="298" rx="7" fill="none" stroke="#2c374a"/>
  <rect x="1" y="1" width="618" height="298" rx="7" fill="#1c2432" opacity="0.6"/>

  <text x="20" y="30" fill="#e8ebf1" font-size="14" font-weight="600">Edit Menu Item</text>

  <!-- Name field -->
  <text x="20" y="55" fill="#8a93a6" font-size="10">NAME</text>
  <rect x="20" y="60" width="280" height="30" rx="5" fill="#242c3d" stroke="#3a4560"/>
  <text x="30" y="80" fill="#e8ebf1" font-size="12">IOU Settlement</text>

  <!-- Route field -->
  <text x="320" y="55" fill="#8a93a6" font-size="10">ROUTE</text>
  <rect x="320" y="60" width="280" height="30" rx="5" fill="#242c3d" stroke="#3a4560"/>
  <text x="330" y="80" fill="#e8ebf1" font-size="12" font-family="Consolas, monospace">/petty-cash/settlement</text>

  <!-- Parent select -->
  <text x="20" y="108" fill="#8a93a6" font-size="10">PARENT</text>
  <rect x="20" y="113" width="280" height="30" rx="5" fill="#242c3d" stroke="#3a4560"/>
  <text x="30" y="133" fill="#e8ebf1" font-size="12">Transactions</text>
  <path d="M280 123 l6 6 l6 -6" stroke="#8a93a6" stroke-width="1.5" fill="none"/>

  <!-- Icon picker label -->
  <text x="320" y="108" fill="#8a93a6" font-size="10">ICON</text>
  <rect x="320" y="113" width="280" height="60" rx="5" fill="#242c3d" stroke="#3a4560"/>
  <g fill="#8a93a6">
    <rect x="330" y="123" width="26" height="20" rx="4" fill="none" stroke="#4f7cff"/>
    <text x="343" y="137" fill="#4f7cff" font-size="12" text-anchor="middle">✓</text>
    <rect x="360" y="123" width="26" height="20" rx="4" fill="none" stroke="#3a4560"/>
    <rect x="390" y="123" width="26" height="20" rx="4" fill="none" stroke="#3a4560"/>
    <rect x="420" y="123" width="26" height="20" rx="4" fill="none" stroke="#3a4560"/>
    <rect x="450" y="123" width="26" height="20" rx="4" fill="none" stroke="#3a4560"/>
    <rect x="480" y="123" width="26" height="20" rx="4" fill="none" stroke="#3a4560"/>
    <rect x="330" y="149" width="26" height="20" rx="4" fill="none" stroke="#3a4560"/>
    <rect x="360" y="149" width="26" height="20" rx="4" fill="none" stroke="#3a4560"/>
    <rect x="390" y="149" width="26" height="20" rx="4" fill="none" stroke="#3a4560"/>
  </g>

  <!-- Checkboxes -->
  <rect x="20" y="180" width="16" height="16" rx="3" fill="none" stroke="#3a4560"/>
  <text x="42" y="192" fill="#c3cad8" font-size="12">Is Group (a folder for other items)</text>

  <rect x="20" y="205" width="16" height="16" rx="3" fill="#4f7cff"/>
  <path d="M23 213 l4 4 l7 -8" stroke="#fff" stroke-width="1.6" fill="none"/>
  <text x="42" y="217" fill="#c3cad8" font-size="12">Active (unchecked hides it everywhere)</text>

  <!-- Save button -->
  <rect x="480" y="255" width="120" height="34" rx="6" fill="#4f7cff"/>
  <text x="540" y="277" fill="#fff" font-size="13" text-anchor="middle" font-weight="600">Save</text>
  <rect x="360" y="255" width="100" height="34" rx="6" fill="none" stroke="#3a4560"/>
  <text x="410" y="277" fill="#aab3c5" font-size="13" text-anchor="middle">Cancel</text>
</svg>
