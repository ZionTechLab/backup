<svg viewBox="0 0 620 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="620" height="460" rx="8" fill="#161c27"/>
  <rect x="1" y="1" width="618" height="458" rx="7" fill="none" stroke="#2c374a"/>

  <text x="20" y="28" fill="#e8ebf1" font-size="15" font-weight="700">Backup</text>

  <!-- Tabs -->
  <rect x="168" y="12" width="100" height="30" rx="6" fill="none" stroke="#3a4560"/>
  <text x="218" y="32" fill="#7d879b" font-size="11" text-anchor="middle">Export</text>
  <rect x="272" y="12" width="100" height="30" rx="6" fill="#4f7cff"/>
  <text x="322" y="32" fill="#fff" font-size="11" text-anchor="middle" font-weight="600">Restore</text>

  <!-- File picker -->
  <text x="20" y="64" fill="#c3cad8" font-size="11" font-weight="700">BACKUP FILE</text>
  <rect x="20" y="72" width="580" height="30" rx="4" fill="#242c3d" stroke="#3a4560"/>
  <text x="34" y="91" fill="#7d879b" font-size="10">backup-tenant-2026-07-15.zip</text>

  <!-- Scope section -->
  <text x="20" y="126" fill="#c3cad8" font-size="11" font-weight="700">SCOPE</text>

  <circle cx="28" cy="146" r="7" fill="none" stroke="#4f7cff"/>
  <circle cx="28" cy="146" r="4" fill="#4f7cff"/>
  <text x="44" y="142" fill="#e8ebf1" font-size="12" font-weight="600">Selected Module(s)</text>
  <text x="44" y="156" fill="#7d879b" font-size="9">Only the tables belonging to the modules you pick.</text>

  <!-- Preview button -->
  <rect x="20" y="174" width="130" height="30" rx="6" fill="none" stroke="#3a4560"/>
  <text x="85" y="194" fill="#c3cad8" font-size="11" text-anchor="middle">Preview</text>

  <line x1="20" y1="216" x2="600" y2="216" stroke="#2c374a"/>

  <!-- Preview header -->
  <text x="20" y="238" fill="#c3cad8" font-size="11" font-weight="700">PREVIEW — backup exported 15/07/2026, 10:42 AM</text>

  <!-- Warning -->
  <rect x="20" y="248" width="580" height="30" rx="4" fill="#3d3220" stroke="#665533"/>
  <text x="34" y="267" fill="#e6c34a" font-size="9">The backup does not contain: debtorTXN_detail — 143 rows currently in the database will be deleted</text>

  <!-- Table header -->
  <g fill="#8a93a6" font-size="9" font-weight="600">
    <rect x="20" y="288" width="580" height="22" rx="3" fill="#1e2634"/>
    <text x="34" y="303">Table</text>
    <text x="340" y="303" text-anchor="end">Currently in DB</text>
    <text x="540" y="303" text-anchor="end">In Backup</text>
  </g>

  <!-- Table rows -->
  <g fill="#c3cad8" font-size="10">
    <!-- Row 1 -->
    <rect x="20" y="310" width="580" height="24" rx="2" fill="#1a2130"/>
    <text x="34" y="326">debtorTXN</text>
    <text x="340" y="326" text-anchor="end">2,451</text>
    <text x="540" y="326" text-anchor="end">2,448</text>

    <!-- Row 2 -->
    <rect x="20" y="334" width="580" height="24" rx="2" fill="#161c27"/>
    <text x="34" y="350">debtorTXN_detail</text>
    <text x="340" y="350" text-anchor="end">143</text>
    <text x="540" y="350" text-anchor="end" fill="#e06c75">—</text>

    <!-- Row 3 -->
    <rect x="20" y="358" width="580" height="24" rx="2" fill="#1a2130"/>
    <text x="34" y="374">VConfirmation</text>
    <text x="340" y="374" text-anchor="end">89</text>
    <text x="540" y="374" text-anchor="end">89</text>

    <!-- Row 4 -->
    <rect x="20" y="382" width="580" height="24" rx="2" fill="#161c27"/>
    <text x="34" y="398">activity_log</text>
    <text x="340" y="398" text-anchor="end">12,830</text>
    <text x="540" y="398" text-anchor="end">12,790</text>

    <!-- Row 5 -->
    <rect x="20" y="406" width="580" height="24" rx="2" fill="#1a2130"/>
    <text x="34" y="422">activity_log_detail</text>
    <text x="340" y="422" text-anchor="end">38,910</text>
    <text x="540" y="422" text-anchor="end">38,855</text>
  </g>

  <!-- Confirm button -->
  <rect x="20" y="442" width="160" height="32" rx="6" fill="#dc3545"/>
  <text x="100" y="463" fill="#fff" font-size="11" text-anchor="middle" font-weight="600">Confirm Restore</text>
</svg>
