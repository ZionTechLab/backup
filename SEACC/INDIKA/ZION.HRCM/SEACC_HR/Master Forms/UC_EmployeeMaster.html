<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Master</title>
    <style>
      :root {
        --primary-color: #0096d6;
        --border-color: #ccc;
        --bg-color: #f9f9f9;
        --text-color: #333;
        --card-bg: #fff;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 1024px;
        background-color: var(--card-bg);
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }

      h1 {
        display: none; /* Title often hidden in embedded UCs, but good for structure */
      }

      .section {
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        margin-bottom: 10px;
        overflow: hidden;
      }

      .section-header {
        background-color: #fff;
        padding: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        font-size: 24px;
        color: var(--primary-color);
        font-weight: 500;
        user-select: none;
        transition: background-color 0.2s;
      }

      .section-header:hover {
        background-color: #f0f8ff;
      }

      .section-header::before {
        content: "▼";
        font-size: 14px;
        margin-right: 15px;
        color: var(--primary-color);
        transform: rotate(-90deg);
        transition: transform 0.3s;
      }

      .section.open .section-header::before {
        transform: rotate(0deg);
      }

      .section-content {
        padding: 20px;
        display: none;
        border-top: 1px solid #e0e0e0;
        animation: slideDown 0.3s ease-out;
      }

      .section.open .section-content {
        display: block;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .form-group {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }

      .form-group label {
        width: 180px;
        font-size: 14px;
        font-weight: 500;
        color: #555;
        flex-shrink: 0;
      }

      .form-group input[type="text"],
      .form-group input[type="date"],
      .form-group select {
        flex-grow: 1;
        padding: 8px 12px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-size: 14px;
        transition: border-color 0.2s;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 2px rgba(0, 150, 214, 0.2);
      }

      .grid-2-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .checkbox-group {
        display: flex;
        gap: 20px;
        margin-top: 20px;
        margin-left: 180px;
      }

      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        cursor: pointer;
      }

      .checkbox-item input {
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      .grid-sub-details {
        margin-left: 180px;
        margin-bottom: 10px;
        font-size: 12px;
        color: #666;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
      }

      /* Footer Salary Section */
      .salary-footer {
        display: flex;
        align-items: center;
        margin-top: 20px;
        padding: 10px;
      }

      .salary-footer img {
        height: 48px;
        width: auto;
        margin-right: 15px;
      }

      .salary-footer span {
        font-size: 24px;
        color: var(--primary-color);
        font-weight: 500;
      }

      /* Buttons */
      .btn {
        background-color: #41b1e1;
        color: white;
        border: 1px solid #9b9b9b;
        padding: 5px 15px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }

      .btn:hover {
        background-color: #2a9ac9;
      }

      /* Tables for grids */
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin-top: 15px;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }

      th {
        background-color: #f2f2f2;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <form>
        <!-- Personal Details -->
        <div class="section open">
          <div class="section-header" onclick="toggleSection(this)">
            Personal Details
          </div>
          <div class="section-content">
            <div class="form-group">
              <label>Employee No.</label
              ><input type="text" id="txtEmployeeNo" />
            </div>
            <div class="form-group">
              <label>EPF No.</label><input type="text" id="txtEPF" />
            </div>
            <div class="form-group">
              <label>Device EMP. No.</label
              ><input type="text" id="txtEmployeeNo2" />
            </div>
            <div class="form-group">
              <label>Title</label
              ><select id="txttitle">
                <option>Mr.</option>
                <option>Mrs.</option>
                <option>Ms.</option>
              </select>
            </div>
            <div class="form-group">
              <label>Surname</label><input type="text" id="txtSureName" />
            </div>
            <div class="form-group">
              <label>Initials</label><input type="text" id="txtInitial" />
            </div>
            <div class="form-group">
              <label>Full Name</label><input type="text" id="txtFullName" />
            </div>
            <div class="form-group">
              <label>Alias Name</label><input type="text" id="txtAliasName" />
            </div>
            <div class="form-group">
              <label>Division</label><input type="text" id="txtDivision" />
            </div>
            <div class="form-group">
              <label>Department</label><input type="text" id="txtDepartment" />
            </div>
            <div class="form-group">
              <label>Section</label><input type="text" id="txtSection" />
            </div>
            <div class="form-group">
              <label>Sub Section</label><input type="text" id="txtSubSection" />
            </div>
            <div class="form-group">
              <label>NIC / SSN #</label><input type="text" id="txtNIC" />
            </div>
            <div class="form-group">
              <label>Driving Lic.#</label
              ><input type="text" id="txtDriving_LicNO" />
            </div>
            <div class="form-group">
              <label>Passport #</label><input type="text" id="txtPassport" />
            </div>
            <div class="form-group">
              <label>Nationality</label
              ><input type="text" id="txtNationality" />
            </div>
            <div class="form-group">
              <label>Visa End Date</label
              ><input type="date" id="dtpVisaEndDate" />
            </div>
            <div class="form-group">
              <label>Religion</label><input type="text" id="txtReligion" />
            </div>
            <div class="form-group">
              <label>Date Of Birth</label><input type="date" id="dtp_DOB" />
            </div>
            <div class="form-group">
              <label>Gender</label
              ><select id="cmb_Gender">
                <option>Male</option>
                <option>Female</option>
              </select>
            </div>
            <div class="form-group">
              <label>Civil Status</label
              ><select id="cmb_CivilStatus">
                <option>Single</option>
                <option>Married</option>
              </select>
            </div>
            <div class="form-group">
              <label>Date Of Marriage</label
              ><input type="date" id="dtp_DateOfMerrage" />
            </div>
            <div class="form-group">
              <label>Status</label
              ><select id="cmb_EmpStatus">
                <option>Active</option>
                <option>Inactive</option>
              </select>
            </div>
            <div class="form-group">
              <label>Designation</label
              ><input type="text" id="txtDesignation" />
            </div>
            <div class="form-group">
              <label>Category 1</label><input type="text" id="txtCategory" />
            </div>
            <div class="form-group">
              <label>Category 2</label><input type="text" id="txtCategory1" />
            </div>
            <div class="form-group">
              <label>Category 3</label><input type="text" id="txtCategory2" />
            </div>
            <div class="form-group">
              <label>Recruitment Type</label
              ><input type="text" id="txtRecuirtmentType" />
            </div>

            <div class="form-group">
              <label>Supervisor</label><input type="text" id="txtSupevisorId" />
            </div>
            <div class="grid-sub-details">
              <span>Department: <span id="lblDepat_Supevisor">...</span></span>
              <span
                >Designation:
                <span id="lblDesignation_Supevisior">...</span></span
              >
            </div>

            <div class="form-group">
              <label>Manager</label><input type="text" id="txtManagerID" />
            </div>
            <div class="grid-sub-details">
              <span
                >Department: <span id="lblDeaprtemnt_manager">...</span></span
              >
              <span
                >Designation: <span id="lblDesignation_manager">...</span></span
              >
            </div>
          </div>
        </div>

        <!-- Contact Information -->
        <div class="section">
          <div class="section-header" onclick="toggleSection(this)">
            Contact Information
          </div>
          <div class="section-content">
            <div class="grid-2-col">
              <div class="col-1">
                <div class="form-group">
                  <label>Address Line 1</label
                  ><input type="text" id="txtAdd1" />
                </div>
                <div class="form-group">
                  <label>Address Line 2</label
                  ><input type="text" id="txtAdd2" />
                </div>
                <div class="form-group">
                  <label>Address Line 3</label
                  ><input type="text" id="txtAdd3" />
                </div>
                <div class="form-group">
                  <label>Country</label><input type="text" id="txtCountry" />
                </div>
                <div class="form-group">
                  <label>Province</label><input type="text" id="txtProvince" />
                </div>
                <div class="form-group">
                  <label>District</label><input type="text" id="txtDistrict" />
                </div>
                <div class="form-group">
                  <label>City</label><input type="text" id="txtCity" />
                </div>
                <div class="form-group">
                  <label>Home Town</label><input type="text" id="txtHomeTown" />
                </div>
                <div class="form-group">
                  <label>Postal Code</label
                  ><input type="text" id="txtPostalCode" />
                </div>
                <div class="form-group">
                  <label>G.S Division</label
                  ><input type="text" id="txtGsDivision" />
                </div>
              </div>
              <div class="col-2">
                <div class="form-group">
                  <label>Telephone (Home)</label
                  ><input type="text" id="txtHomeTelephone" />
                </div>
                <div class="form-group">
                  <label>Telephone (Office)</label
                  ><input type="text" id="txtOfficeTelephone" />
                </div>
                <div class="form-group">
                  <label>Office Ext. No.</label
                  ><input type="text" id="txtOfficeExt" />
                </div>
                <div class="form-group">
                  <label>Mobile 1</label><input type="text" id="txtMobile" />
                </div>
                <div class="form-group">
                  <label>Mobile 2</label><input type="text" id="txtMobile2" />
                </div>
                <div class="form-group">
                  <label>Mobile (Office)</label
                  ><input type="text" id="txtOfficeMobile" />
                </div>
                <div class="form-group">
                  <label>Emerg. Cont. Person 1</label
                  ><input type="text" id="txtEmrgContPer1" />
                </div>
                <div class="form-group">
                  <label>Emerg. Contact 1</label
                  ><input type="text" id="txtImrgContact1" />
                </div>
                <div class="form-group">
                  <label>Emerg. Cont. Person 2</label
                  ><input type="text" id="txtimrgcontPer2" />
                </div>
                <div class="form-group">
                  <label>Emerg. Contact 2</label
                  ><input type="text" id="txtImrgcontact2" />
                </div>
                <div class="form-group">
                  <label>Personal Email</label
                  ><input type="email" id="txtEmail" />
                </div>
                <div class="form-group">
                  <label>Office Email</label
                  ><input type="email" id="txtOfficeEmail" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Payroll Information -->
        <div class="section open">
          <div class="section-header" onclick="toggleSection(this)">
            Payroll Information
          </div>
          <div class="section-content">
            <div class="form-group">
              <label>Payroll Group</label
              ><input type="text" id="txtpayrollGroup" />
            </div>

            <div class="checkbox-group">
              <label class="checkbox-item"
                ><input type="checkbox" checked /> Time Attendance</label
              >
              <label class="checkbox-item"
                ><input type="checkbox" checked /> Payroll process</label
              >
              <label class="checkbox-item"
                ><input type="checkbox" checked /> Payslip Print</label
              >
              <label class="checkbox-item"
                ><input type="checkbox" checked /> EPF/ETF Process</label
              >
            </div>

            <div style="margin-top: 20px">
              <div class="form-group">
                <label>Payment Method</label
                ><input type="text" id="txtPayementBy" />
              </div>
              <div class="form-group">
                <label>Bank Account No</label
                ><input type="text" id="txtAccountNo" />
              </div>
              <div class="form-group">
                <label>Bank Acct. Name</label
                ><input type="text" id="txtAccountName" />
              </div>
              <div class="form-group">
                <label>Bank</label><input type="text" id="txtBank" />
              </div>
              <div class="form-group">
                <label>Bank Branch</label><input type="text" id="txtBranch" />
              </div>
              <div class="form-group">
                <label>Date of Joined</label
                ><input type="date" id="dtp_JoinDate" />
              </div>
              <div class="form-group">
                <label>Date of Confirm</label
                ><input type="date" id="dtp_DateOfConfirm" />
              </div>
              <div class="form-group">
                <label>Date of Retirement</label
                ><input type="date" id="dtp_Terminate" />
              </div>
              <div class="form-group">
                <label>Last Working Date</label
                ><input type="date" id="dtpLastWorkingDate" />
              </div>
              <div class="form-group">
                <label>Last Payroll End Date</label
                ><input type="date" id="dtp_PayrollEendDate" />
              </div>
            </div>
          </div>
        </div>

        <!-- Document Management (Default Closed) -->
        <div class="section">
          <div class="section-header" onclick="toggleSection(this)">
            Document Management
          </div>
          <div class="section-content">
            <div class="form-group">
              <label>Document Type</label>
              <input type="text" id="txtDocumentType" />
              <button type="button" class="btn" style="margin-left: 10px">
                Upload
              </button>
            </div>

            <table>
              <thead>
                <tr>
                  <th>No.</th>
                  <th>Icon</th>
                  <th>File Detail</th>
                  <th>Document Type</th>
                  <th>Upload Date</th>
                  <th>Upload By</th>
                  <th>Download</th>
                </tr>
              </thead>
              <tbody>
                <!-- Empty for now -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Employees Skills (Default Closed) -->
        <div class="section">
          <div class="section-header" onclick="toggleSection(this)">
            Employee Skills
          </div>
          <div class="section-content">
            <table>
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Skill Category</th>
                </tr>
              </thead>
              <tbody>
                <!-- Empty for now -->
              </tbody>
            </table>
          </div>
        </div>

        <div class="salary-footer">
          <svg
            width="48"
            height="48"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#FF0096D6"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="margin-right: 15px"
          >
            <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
            <line x1="12" y1="2" x2="12" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
          </svg>
          <span>Salary</span>
        </div>
      </form>
    </div>

    <script>
      function toggleSection(header) {
        header.parentElement.classList.toggle("open");
      }
    </script>
  </body>
</html>
